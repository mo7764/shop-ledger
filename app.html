<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Shop Ledger"><meta name="theme-color" content="#0d1117"><title>Shop Ledger</title><style>:root{--bg:#0d1117;--s:#161b22;--s2:#1c2333;--bd:#30363d;--bd2:#21262d;--g:#3fb950;--gd:#238636;--r:#f85149;--rd:#da3633;--bl:#58a6ff;--p:#bc8cff;--o:#e3b341;--t:#e6edf3;--m:#7d8590}*{box-sizing:border-box;margin:0;padding:0}html,body{height:100%;overflow:hidden}body{font-family:system-ui,sans-serif;background:var(--bg);color:var(--t);display:flex;flex-direction:column}.tb{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--s);border-bottom:1px solid var(--bd);flex-shrink:0;gap:8px}.tb h1{font-size:1rem;font-weight:800;color:var(--o)}select{background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:var(--t);font-size:.8rem;padding:5px 8px;outline:none}.mp{display:flex;gap:5px}.btns{display:flex;gap:5px}.btn{padding:6px 11px;border-radius:7px;border:none;font-size:.78rem;font-weight:700;cursor:pointer}.bs{background:var(--gd);color:#fff}.be{background:var(--s2);color:var(--bl);border:1px solid var(--bl)}.strip{display:flex;gap:6px;padding:8px 12px;background:var(--s);border-bottom:1px solid var(--bd);overflow-x:auto;flex-shrink:0;scrollbar-width:none}.pill{display:flex;flex-direction:column;align-items:center;min-width:90px;padding:6px 10px;border-radius:9px;border:1px solid var(--bd2);flex-shrink:0}.pill .l{font-size:.57rem;color:var(--m);margin-bottom:2px;text-transform:uppercase;font-weight:600}.pill .v{font-size:.88rem;font-weight:800;white-space:nowrap}.pg{background:rgba(63,185,80,.1);border-color:var(--gd)}.pg .v{color:var(--g)}.pr{background:rgba(248,81,73,.1);border-color:var(--rd)}.pr .v{color:var(--r)}.pb{background:rgba(88,166,255,.1);border-color:#1f6feb}.pb .v{color:var(--bl)}.pp{background:rgba(188,140,255,.1);border-color:#6e40c9}.pp .v{color:var(--p)}.po{background:rgba(227,179,65,.1);border-color:#9e6a03}.po .v{color:var(--o)}.np{color:var(--g)!important}.nn{color:var(--r)!important}.tabs{display:flex;border-bottom:1px solid var(--bd);background:var(--s);flex-shrink:0}.tab{flex:1;padding:9px 4px;background:none;border:none;color:var(--m);font-size:.76rem;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}.tab.a{color:var(--bl);border-bottom-color:var(--bl)}.tw{flex:1;overflow:auto;scrollbar-width:thin}table{border-collapse:collapse;font-size:.76rem;min-width:960px;width:100%}thead th{position:sticky;top:0;z-index:10;background:var(--s);padding:0;white-space:nowrap;border:1px solid var(--bd)}.tg{background:var(--s2);padding:4px 6px;text-align:center;font-size:.67rem;border-bottom:1px solid var(--bd);font-weight:700;text-transform:uppercase}.tg.gi{color:var(--g)}.tg.ge{color:var(--r)}.tg.gs{color:var(--bl)}.tg.gm{color:var(--p)}.tg.gn{color:var(--o)}.ts{padding:4px 6px;text-align:center;font-size:.64rem;color:var(--m);font-weight:600}td:first-child,th:first-child{position:sticky;left:0;z-index:5;background:var(--s2);font-weight:700;color:var(--o);text-align:center;min-width:34px;max-width:34px;border:1px solid var(--bd)}thead th:first-child{z-index:11;background:var(--s)}tbody tr{border-bottom:1px solid var(--bd2)}td{border-right:1px solid var(--bd2);border-left:1px solid var(--bd2);padding:0;vertical-align:middle}td input[type=number]{width:100%;border:none;background:transparent;color:var(--t);font-size:.76rem;text-align:center;padding:6px 3px;outline:none;min-width:74px}td input[type=number]:focus{background:rgba(88,166,255,.08);box-shadow:inset 0 0 0 1.5px var(--bl)}td input[type=text]{width:100%;border:none;background:transparent;color:var(--m);font-size:.7rem;text-align:left;padding:6px 7px;outline:none;min-width:110px}td input::-webkit-outer-spin-button,td input::-webkit-inner-spin-button{-webkit-appearance:none}.c{font-weight:700;text-align:center;padding:6px 5px;white-space:nowrap}.cg{color:var(--g)}.cr{color:var(--r)}.cb{color:var(--bl)}.cp{color:var(--p)}.co{color:var(--o)}.tr2 td{font-weight:800;font-size:.8rem;background:var(--s2)!important;border-top:2px solid var(--bd);padding:7px 5px;text-align:center}.sp{display:none;flex:1;overflow-y:auto;padding:14px}.ss{margin-bottom:18px}.ss h3{font-size:.67rem;font-weight:700;color:var(--m);letter-spacing:1px;text-transform:uppercase;margin-bottom:9px;padding-bottom:5px;border-bottom:1px solid var(--bd)}.sg{display:grid;grid-template-columns:1fr 1fr;gap:7px}.si{background:var(--s);border:1px solid var(--bd2);border-radius:9px;padding:11px}.si .sl{font-size:.64rem;color:var(--m);margin-bottom:3px;font-weight:600;text-transform:uppercase}.si .sv{font-size:1.05rem;font-weight:800}.si .sb{font-size:.63rem;color:#484f58;margin-top:2px}.sf{grid-column:span 2}.sig{border-color:var(--gd);background:rgba(63,185,80,.1)}.sig .sv{color:var(--g)}.sir{border-color:var(--rd);background:rgba(248,81,73,.1)}.sir .sv{color:var(--r)}.sib{border-color:#1f6feb;background:rgba(88,166,255,.1)}.sib .sv{color:var(--bl)}.sip{border-color:#6e40c9;background:rgba(188,140,255,.1)}.sip .sv{color:var(--p)}.sio{border-color:#9e6a03;background:rgba(227,179,65,.1)}.sio .sv{color:var(--o)}.mo{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:14px}.mo.op{display:flex}.md{background:var(--s);border:1px solid var(--bd);border-radius:14px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto}.mh{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--bd)}.mh h3{font-size:.9rem;font-weight:800}.mc{background:var(--s2);border:1px solid var(--bd);border-radius:7px;color:var(--m);width:30px;height:30px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}.mb{padding:14px 18px}.st{background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:12px;font-size:.8rem;line-height:1.8;white-space:pre-wrap;color:var(--t);max-height:280px;overflow-y:auto;margin-bottom:12px}.ma{display:flex;gap:8px}.bc{background:var(--s2);color:var(--t);border:1px solid var(--bd);flex:1;border-radius:7px}.bw{background:#25D366;color:#fff;flex:1;border-radius:7px}@media(max-width:600px){.btn span{display:none}.sg{grid-template-columns:1fr}.sf{grid-column:span 1}}</style></head><body>
<div class="tb"><h1>🏪 Shop Ledger</h1><div class="mp"><select id="sm"><option value="1">Jan</option><option value="2">Feb</option><option value="3">Mar</option><option value="4">Apr</option><option value="5">May</option><option value="6">Jun</option><option value="7">Jul</option><option value="8">Aug</option><option value="9">Sep</option><option value="10">Oct</option><option value="11">Nov</option><option value="12">Dec</option></select><select id="sy"></select></div><div class="btns"><button class="btn bs" onclick="openShare()">🔗 Share</button><button class="btn be" onclick="exportCSV()">📥 Export</button></div></div>
<div class="strip"><div class="pill pg"><div class="l">Income</div><div class="v" id="s1">0.00</div></div><div class="pill pr"><div class="l">Expenses</div><div class="v" id="s2">0.00</div></div><div class="pill pb"><div class="l">Salaries</div><div class="v" id="s3">0.00</div></div><div class="pill pp"><div class="l">Mohamed</div><div class="v" id="s4">0.00</div></div><div class="pill pg"><div class="l">Cash In</div><div class="v" id="s5">0.00</div></div><div class="pill pb"><div class="l">Card In</div><div class="v" id="s6">0.00</div></div><div class="pill pr"><div class="l">Cash Out</div><div class="v" id="s7">0.00</div></div><div class="pill pr"><div class="l">Bank Out</div><div class="v" id="s8">0.00</div></div><div class="pill po"><div class="l">Net</div><div class="v" id="s9">0.00</div></div></div>
<div class="tabs"><button class="tab a" onclick="showTab('t',this)">📋 Daily Log</button><button class="tab" onclick="showTab('s',this)">📊 Summary</button></div>
<div class="tw" id="tt"><table><thead><tr><th rowspan="2"><div class="ts">Day</div></th><th colspan="3" class="tg gi">📥 Income</th><th colspan="3" class="tg ge">📤 Expenses</th><th colspan="3" class="tg gs">👥 Salaries</th><th colspan="3" class="tg gm">🤲 Mohamed</th><th class="tg gn">💰 Net</th><th class="tg" style="color:var(--m)">📝</th></tr><tr><th class="ts" style="color:var(--g)">Cash</th><th class="ts" style="color:var(--g)">Card</th><th class="ts" style="color:var(--g);font-weight:900">Total</th><th class="ts" style="color:var(--r)">Cash</th><th class="ts" style="color:var(--r)">Bank</th><th class="ts" style="color:var(--r);font-weight:900">Total</th><th class="ts" style="color:var(--bl)">Cash</th><th class="ts" style="color:var(--bl)">Bank</th><th class="ts" style="color:var(--bl);font-weight:900">Total</th><th class="ts" style="color:var(--p)">Cash</th><th class="ts" style="color:var(--p)">Bank</th><th class="ts" style="color:var(--p);font-weight:900">Total</th><th class="ts" style="color:var(--o);font-weight:900">Daily Net</th><th class="ts">Notes</th></tr></thead><tbody id="tb"></tbody><tfoot id="tf"></tfoot></table></div>
<div class="sp" id="ts"><div id="sc"></div></div>
<div class="mo" id="mo"><div class="md"><div class="mh"><h3>🔗 Share Summary</h3><button class="mc" onclick="closeShare()">✕</button></div><div class="mb"><div class="st" id="stx"></div><div class="ma"><button class="btn bc" onclick="copyShare()">📋 Copy</button><button class="btn bw" onclick="shareWA()">💬 WhatsApp</button></div></div></div></div>
<script>
const now=new Date();let M=now.getMonth()+1,Y=now.getFullYear(),D={};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function init(){const sy=document.getElementById('sy');for(let y=Y-3;y<=Y+2;y++){const o=document.createElement('option');o.value=y;o.textContent=y;if(y===Y)o.selected=true;sy.appendChild(o)}document.getElementById('sm').value=M;load();render();document.getElementById('sm').onchange=()=>{M=+document.getElementById('sm').value;render()};document.getElementById('sy').onchange=()=>{Y=+document.getElementById('sy').value;render()}}
function load(){try{D=JSON.parse(localStorage.getItem('sl')||'{}')}catch(e){D={}}}
function save(){localStorage.setItem('sl',JSON.stringify(D))}
function gd(y,m,d){return D[`${y}-${m}-${d}`]||{a:0,b:0,c:0,e:0,f:0,g:0,h:0,i:0,n:''}}
function sf(y,m,d,k,v){const key=`${y}-${m}-${d}`;if(!D[key])D[key]={a:0,b:0,c:0,e:0,f:0,g:0,h:0,i:0,n:''};D[key][k]=v;save();tots()}
function dim(y,m){return new Date(y,m,0).getDate()}
function fmt(n){return(+n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function render(){
  const days=dim(Y,M),tb=document.getElementById('tb');tb.innerHTML='';
  for(let d=1;d<=days;d++){
    const r=gd(Y,M,d),tr=document.createElement('tr');
    const td0=document.createElement('td');td0.textContent=d;tr.appendChild(td0);
    function ni(k,col){const td=document.createElement('td'),inp=document.createElement('input');inp.type='number';inp.min='0';inp.step='0.01';inp.value=r[k]||'';inp.placeholder='0';inp.style.color=col;inp.addEventListener('input',e=>{sf(Y,M,d,k,parseFloat(e.target.value)||0);ucr(tr,d)});td.appendChild(inp);return td}
    tr.appendChild(ni('a','var(--g)'));tr.appendChild(ni('b','var(--g)'));
    const t1=document.createElement('td');t1.className='c cg';t1.dataset.r='it';t1.textContent=fmt(r.a+r.b);tr.appendChild(t1);
    tr.appendChild(ni('c','var(--r)'));tr.appendChild(ni('e','var(--r)'));
    const t2=document.createElement('td');t2.className='c cr';t2.dataset.r='et';t2.textContent=fmt(r.c+r.e);tr.appendChild(t2);
    tr.appendChild(ni('f','var(--bl)'));tr.appendChild(ni('g','var(--bl)'));
    const t3=document.createElement('td');t3.className='c cb';t3.dataset.r='st';t3.textContent=fmt(r.f+r.g);tr.appendChild(t3);
    tr.appendChild(ni('h','var(--p)'));tr.appendChild(ni('i','var(--p)'));
    const t4=document.createElement('td');t4.className='c cp';t4.dataset.r='mt';t4.textContent=fmt(r.h+r.i);tr.appendChild(t4);
    const net=(r.a+r.b)-(r.c+r.e)-(r.f+r.g)-(r.h+r.i);
    const t5=document.createElement('td');t5.className='c';t5.dataset.r='nt';t5.style.fontWeight='800';t5.style.color=net>=0?'var(--g)':'var(--r)';t5.textContent=fmt(net);tr.appendChild(t5);
    const tn=document.createElement('td'),ni2=document.createElement('input');ni2.type='text';ni2.placeholder='Notes...';ni2.value=r.n||'';ni2.addEventListener('change',e=>sf(Y,M,d,'n',e.target.value));tn.appendChild(ni2);tr.appendChild(tn);
    tb.appendChild(tr);
  }
  tots();
}
function ucr(tr,d){
  const r=gd(Y,M,d);
  const it=r.a+r.b,et=r.c+r.e,st=r.f+r.g,mt=r.h+r.i,nt=it-et-st-mt;
  tr.querySelector('[data-r="it"]').textContent=fmt(it);tr.querySelector('[data-r="et"]').textContent=fmt(et);
  tr.querySelector('[data-r="st"]').textContent=fmt(st);tr.querySelector('[data-r="mt"]').textContent=fmt(mt);
  const ne=tr.querySelector('[data-r="nt"]');ne.textContent=fmt(nt);ne.style.color=nt>=0?'var(--g)':'var(--r)';
}
function ct(){
  const days=dim(Y,M);let t={a:0,b:0,c:0,e:0,f:0,g:0,h:0,i:0};
  for(let d=1;d<=days;d++){const r=gd(Y,M,d);for(const k in t)t[k]+=+r[k]||0}
  t.it=t.a+t.b;t.et=t.c+t.e;t.st=t.f+t.g;t.mt=t.h+t.i;
  t.oc=t.c+t.f+t.h;t.ob=t.e+t.g+t.i;t.tot=t.et+t.st+t.mt;t.net=t.it-t.tot;return t;
}
function tots(){
  const t=ct();
  document.getElementById('s1').textContent=fmt(t.it);document.getElementById('s2').textContent=fmt(t.tot);
  document.getElementById('s3').textContent=fmt(t.st);document.getElementById('s4').textContent=fmt(t.mt);
  document.getElementById('s5').textContent=fmt(t.a);document.getElementById('s6').textContent=fmt(t.b);
  document.getElementById('s7').textContent=fmt(t.oc);document.getElementById('s8').textContent=fmt(t.ob);
  const ne=document.getElementById('s9');ne.textContent=fmt(t.net);ne.className='v '+(t.net>=0?'np':'nn');
  const tf=document.getElementById('tf');
  tf.innerHTML=`<tr class="tr2"><td>TOTAL</td><td style="color:var(--g)">${fmt(t.a)}</td><td style="color:var(--g)">${fmt(t.b)}</td><td style="color:var(--g);font-weight:900">${fmt(t.it)}</td><td style="color:var(--r)">${fmt(t.c)}</td><td style="color:var(--r)">${fmt(t.e)}</td><td style="color:var(--r);font-weight:900">${fmt(t.et)}</td><td style="color:var(--bl)">${fmt(t.f)}</td><td style="color:var(--bl)">${fmt(t.g)}</td><td style="color:var(--bl);font-weight:900">${fmt(t.st)}</td><td style="color:var(--p)">${fmt(t.h)}</td><td style="color:var(--p)">${fmt(t.i)}</td><td style="color:var(--p);font-weight:900">${fmt(t.mt)}</td><td style="color:${t.net>=0?'var(--g)':'var(--r)'};font-weight:900">${fmt(t.net)}</td><td></td></tr>`;
  sumPage(t);
}
function sumPage(t){
  const mn=MN[M-1],p=v=>t.it>0?((v/t.it)*100).toFixed(1)+'%':'0%';
  document.getElementById('sc').innerHTML=`<div class="ss"><h3>📅 ${mn} ${Y}</h3><div class="sg"><div class="si sig sf"><div class="sl">Total Income</div><div class="sv">${fmt(t.it)}</div><div class="sb">Cash: ${fmt(t.a)} · Card: ${fmt(t.b)}</div></div></div></div><div class="ss"><h3>📤 Outgoings</h3><div class="sg"><div class="si sir"><div class="sl">Expenses</div><div class="sv">${fmt(t.et)}</div><div class="sb">Cash: ${fmt(t.c)} · Bank: ${fmt(t.e)}</div></div><div class="si sib"><div class="sl">Salaries</div><div class="sv">${fmt(t.st)}</div><div class="sb">Cash: ${fmt(t.f)} · Bank: ${fmt(t.g)}</div></div><div class="si sip sf"><div class="sl">Mohamed Draws</div><div class="sv">${fmt(t.mt)}</div><div class="sb">Cash: ${fmt(t.h)} · Bank: ${fmt(t.i)}</div></div><div class="si sir sf"><div class="sl">Total Out</div><div class="sv">${fmt(t.tot)}</div><div class="sb">${p(t.tot)} of income</div></div></div></div><div class="ss"><h3>🏦 Cash vs Bank</h3><div class="sg"><div class="si sig"><div class="sl">Cash Out</div><div class="sv">${fmt(t.oc)}</div><div class="sb">${p(t.oc)}</div></div><div class="si sib"><div class="sl">Bank Out</div><div class="sv">${fmt(t.ob)}</div><div class="sb">${p(t.ob)}</div></div></div></div><div class="ss"><h3>💰 Net</h3><div class="sg"><div class="si sio sf"><div class="sl">Monthly Net Profit</div><div class="sv" style="color:${t.net>=0?'var(--g)':'var(--r)'};font-size:1.4rem">${fmt(t.net)}</div><div class="sb">${t.net>=0?'✅ Profit':'⚠️ Loss'}</div></div></div></div>`;
}
function showTab(tab,btn){document.getElementById('tt').style.display=tab==='t'?'block':'none';document.getElementById('ts').style.display=tab==='s'?'block':'none';document.querySelectorAll('.tab').forEach(b=>b.classList.remove('a'));btn.classList.add('a')}
function bst(){const t=ct(),mn=MN[M-1];return`📊 Shop Summary — ${mn} ${Y}\n━━━━━━━━━━━━━━━━━━━━\n📥 INCOME\n  💵 Cash: ${fmt(t.a)}\n  💳 Card: ${fmt(t.b)}\n  ✅ Total: ${fmt(t.it)}\n━━━━━━━━━━━━━━━━━━━━\n📤 EXPENSES\n  💵 Cash: ${fmt(t.c)}\n  🏦 Bank: ${fmt(t.e)}\n  Total: ${fmt(t.et)}\n━━━━━━━━━━━━━━━━━━━━\n👥 SALARIES\n  💵 Cash: ${fmt(t.f)}\n  🏦 Bank: ${fmt(t.g)}\n  Total: ${fmt(t.st)}\n━━━━━━━━━━━━━━━━━━━━\n🤲 MOHAMED\n  💵 Cash: ${fmt(t.h)}\n  🏦 Bank: ${fmt(t.i)}\n  Total: ${fmt(t.mt)}\n━━━━━━━━━━━━━━━━━━━━\n💵 Cash Out: ${fmt(t.oc)}\n🏦 Bank Out: ${fmt(t.ob)}\n━━━━━━━━━━━━━━━━━━━━\n💰 NET: ${fmt(t.net)} ${t.net>=0?'✅':'⚠️'}`}
function openShare(){document.getElementById('stx').textContent=bst();document.getElementById('mo').classList.add('op')}
function closeShare(){document.getElementById('mo').classList.remove('op')}
function copyShare(){navigator.clipboard.writeText(document.getElementById('stx').textContent).then(()=>{const b=document.querySelector('.bc');b.textContent='✅ Copied!';setTimeout(()=>b.textContent='📋 Copy',1500)})}
function shareWA(){window.open('https://wa.me/?text='+encodeURIComponent(bst()),'_blank')}
function exportCSV(){const days=dim(Y,M),mn=MN[M-1];let csv='Day,Cash In,Card In,Total In,Exp Cash,Exp Bank,Total Exp,Sal Cash,Sal Bank,Total Sal,Moh Cash,Moh Bank,Total Moh,Net,Notes\n';for(let d=1;d<=days;d++){const r=gd(Y,M,d);const it=r.a+r.b,et=r.c+r.e,st=r.f+r.g,mt=r.h+r.i,nt=it-et-st-mt;csv+=[d,r.a,r.b,it,r.c,r.e,et,r.f,r.g,st,r.h,r.i,mt,nt,`"${r.n||''}"`].join(',')+'\n'}const a=document.createElement('a');a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);a.download=`Shop_${mn}_${Y}.csv`;a.click()}
document.getElementById('tt').style.display='block';
document.getElementById('mo').addEventListener('click',function(e){if(e.target===this)closeShare()});
init();
</script></body></html>
